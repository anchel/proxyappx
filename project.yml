name: ProxyAppX
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig
packages:
  ProxyAppXCore:
    path: Packages/ProxyAppXCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  ProxyAppX:
    type: application
    platform: macOS
    sources:
      - path: ProxyAppX
    settings:
      base:
        PRODUCT_NAME: ProxyAppX
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        INFOPLIST_FILE: ProxyAppX/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProxyAppX/ProxyAppX.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROVISIONING_PROFILE_SPECIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        EXTENSION_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.extension
    dependencies:
      - package: ProxyAppXCore
      - target: ProxyAppXExtension
        embed: true
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
      - sdk: ServiceManagement.framework
  ProxyAppXExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: ProxyAppXExtension
    settings:
      base:
        PRODUCT_NAME: $(BUNDLE_ID_PREFIX).app.extension
        PRODUCT_MODULE_NAME: ProxyAppXExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.extension
        INFOPLIST_FILE: ProxyAppXExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProxyAppXExtension/ProxyAppXExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(EXT_PROVISIONING_PROFILE_SPECIFIER)
        SKIP_INSTALL: YES
    dependencies:
      - package: ProxyAppXCore
      - sdk: NetworkExtension.framework
schemes:
  ProxyAppX:
    build:
      targets:
        ProxyAppX: all
        ProxyAppXExtension: all
    run:
      config: Debug
    archive:
      config: Release
